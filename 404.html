<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — Glow &amp; Grace</title>
<meta name="description" content="The page you are looking for may have moved or no longer exists.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C65370">
<link rel="icon" type="image/webp" href="images/favicon.webp">
<style>
:root{
  --blush:#F7DDE2;--rose:#C65370;--deep:#963B57;--ivory:#FFF9F4;--cream:#F1E6DE;--char:#252127;
  --peach:#F3C6B8;--muted:#5E5460;--line:rgba(37,33,39,.14);--r:6px;--ease:cubic-bezier(.22,.8,.3,1);
  --serif:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;font-family:var(--sans);font-size:16px;line-height:1.65;color:var(--char);background:var(--ivory)}
img,svg{max-width:100%}
img{display:block;height:auto}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:3px}
.i{width:1.2em;height:1.2em;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.nf{width:100%;max-width:1040px;margin:0 auto;padding:clamp(24px,5vw,56px) 20px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(28px,6vw,80px);align-items:center}

/* arched mirror frame */
.arch{position:relative;aspect-ratio:4/5;max-width:420px;width:100%;justify-self:center;border-radius:999px 999px 10px 10px;overflow:hidden;background:var(--blush);border:8px solid #fff;outline:1px solid var(--line);box-shadow:0 30px 60px rgba(150,59,87,.2);animation:rise 1s var(--ease) both}
.arch img{width:100%;height:100%;object-fit:cover}
@keyframes rise{from{clip-path:inset(100% 0 0 0);opacity:.4}to{clip-path:inset(0);opacity:1}}

.copy{min-width:0}
.logo{display:inline-block;margin-bottom:clamp(20px,4vw,36px)}
.logo img{height:44px;width:auto}
.code{font-family:var(--serif);font-weight:600;font-size:clamp(5rem,16vw,10rem);line-height:.82;letter-spacing:-.02em;margin:0 0 12px;color:var(--rose)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,4.4vw,2.9rem);line-height:1.12;margin:0 0 14px;color:var(--char)}
.lede{max-width:46ch;margin:0 0 28px;color:var(--muted);font-size:1.05rem}
.actions{display:flex;flex-wrap:wrap;gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 26px;border-radius:var(--r);border:1.5px solid var(--rose);font:inherit;font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;line-height:1.2;transition:background .25s,color .25s,transform .25s var(--ease),box-shadow .25s}
.btn-primary{background:var(--rose);color:#fff;box-shadow:0 8px 20px rgba(198,83,112,.28)}
.btn-primary:hover{background:var(--deep);border-color:var(--deep);transform:translateY(-2px)}
.btn-outline{background:transparent;color:var(--deep)}
.btn-outline:hover{background:var(--blush);transform:translateY(-2px)}

@media (max-width:760px){
  .nf{grid-template-columns:minmax(0,1fr);text-align:center;gap:28px}
  .arch{max-width:260px;order:2}
  .copy{order:1}
  .lede{margin-inline:auto}
  .actions{justify-content:center}
  .code{font-size:clamp(4.5rem,24vw,7rem)}
}
@media (max-width:420px){.btn{width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7.5 9 7.5M5.5 9.5V20h13V9.5M10 20v-5.5h4V20"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H5M11 6l-6 6 6 6"/></symbol>
</defs></svg>

<main class="nf" id="main">
  <div class="arch"><img src="images/not-found.webp" width="900" height="900" alt="Illustrated rose-framed mirror reflecting sparkles"></div>

  <div class="copy">
    <a class="logo" href="index.html" aria-label="Glow &amp; Grace — Home"><img src="images/logo-rose.webp" width="640" height="225" alt="Glow &amp; Grace"></a>
    <p class="code" aria-hidden="true">404</p>
    <h1>We couldn’t find that page.</h1>
    <p class="lede">The page you are looking for may have moved or no longer exists. Go back to where you were, or start again from the home page.</p>
    <div class="actions">
      <a class="btn btn-primary" href="index.html"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-home"/></svg> Go home</a>
      <button class="btn btn-outline" id="go-back" type="button"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-back"/></svg> Go back</button>
    </div>
  </div>
</main>

<script>
document.getElementById('go-back').addEventListener('click', function () {
  // If there is any earlier page in this tab's history, return to it.
  // Only fall back to home when the 404 was opened directly (nothing to go back to).
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = 'index.html';
  }
});
</script>
</body>
</html>
